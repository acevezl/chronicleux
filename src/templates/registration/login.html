{% load static %}
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login · ChronicleUX</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
  </head>

  <body class="min-h-screen bg-gray-50 flex items-center justify-center p-6">
    <div class="w-full max-w-sm bg-white border border-gray-200 dark:border-gray-600 rounded-md overflow-hidden">
      <div class="flex flex-col border-b border-gray-200 bg-white dark:bg-gray-800 dark:border-gray-600 p-6">
        <h1 class="text-3xl font-serif text-fuchsia-700 dark:text-gray-300" >ChronicleUX</h1>
        <span class="text-sm dark:text-gray-400">A Diary Study Research Platform</span>
      </div>
      <div class="px-6 pt-4">
        <p class="mt-1 text-sm text-gray-600">Sign in to continue.</p>

        {% if form.errors %}
          <div class="mt-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded p-3">
            Please check your username and password and try again.
          </div>
        {% endif %}

        <form method="post" class="mt-4 space-y-4">
          {% csrf_token %}

          <div>
            <label class="block text-sm font-medium text-gray-700">Username</label>
            <input
              type="text"
              name="{{ form.username.name }}"
              value="{{ form.username.value|default:'' }}"
              class="text-gray-600 mt-1 px-3 py-2 block w-full rounded-sm border border-gray-300 focus:ring-gray-700 dark:text-gray-200"
              autofocus
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">Password</label>
            <input
              type="password"
              name="{{ form.password.name }}"
              class="text-gray-600 mt-1 px-3 py-2 block w-full rounded-sm border border-gray-300 focus:ring-gray-700 dark:text-gray-200"
            />
          </div>

          <button class="w-full items-center rounded-md bg-fuchsia-800 px-4 py-2 text-white hover:bg-fuchsia-700 cursor-pointer" type="submit">
            Sign in
          </button>

          <p class="text-sm text-gray-600 text-center mt-4">
            New here?
            <a class="underline" href="/accounts/signup/">Create an account</a>
          </p>

          <input type="hidden" name="next" value="{{ next }}">
        </div>
      </form>
    </div>
  </body>
</html>
