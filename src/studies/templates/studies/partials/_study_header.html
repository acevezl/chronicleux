<div>
    <div class="px-4 pt-6 pb-4 border-b border-gray-200">

        <!-- STUDY TITLE -->
        <span class="top-title">
            {% heroicon_outline "folder-open" %}
            {{study.title}}
        </span>

        <!-- STUDY META DATA -->
        <div class="flex md:grid-cols-2 gap-6">
            <div class="top-subtitle">
            Owner: {{ study.owner.username }}
            </div>

            <div class="top-subtitle">
            Created on: {{ study.created_at|date:"Y-m-d H:i" }}
            </div>
        </div>

    </div>

    {% if actions_menu_template %}
		{% include actions_menu_template with study=study is_evaluator=is_evaluator %}
	{% endif %}

</div>
