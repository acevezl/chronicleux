<div class="group main-card">
    <div class="card-summary">
        <div class="card-summary-title">
            {% heroicon_outline "exclamation-triangle" %}
            Recurring Issues
        </div>

        <div class="card-summary-subtitle">
			{% if issue_distribution %}
				<div class="flex flex-wrap gap-2">
					{% for issue in issue_distribution|slice:":3" %}
						<span class="inline-flex items-center rounded-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 px-3 py-1 text-xs font-medium text-gray-700 dark:text-gray-200">
							{{ issue.label|capfirst }}
							<span class="ml-1 text-gray-500 dark:text-gray-400">
								{{ issue.count }}
							</span>
						</span>
					{% endfor %}
				</div>
			{% else %}
				<span class="text-sm text-gray-500 dark:text-gray-400">
					—
				</span>
			{% endif %}
		</div>

    </div>

    {% if issue_distribution %}
    <div class="mt-4">
        <div class="relative h-64 w-full overflow-hidden">
            <canvas
                id="issueDistributionChart-{{ study_id }}-{{ run_id }}"
            ></canvas>
        </div>
    </div>
    {% endif %}
</div>




<script>
    function prettifyIssueLabel(label) {
        return label
            .replaceAll("_", " ")
            .split(" ")
            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
            .join(" ");
    }

    const issueData = [
        {% for issue in issue_distribution %}
            {
                label: "{{ issue.label|escapejs }}",
                count: {{ issue.count }},
                percentage: {{ issue.percentage }}
            },
        {% endfor %}
    ];

    const issueLabels = issueData.map(item => {
        const label = prettifyIssueLabel(item.label);
        const percentage = (item.percentage * 100).toFixed(1);
        return `${label} (${percentage}%)`;
    });

    const issueCounts = issueData.map(item => item.count);

    const issueCtx = document.getElementById("issueDistributionChart-{{ study_id }}-{{ run_id }}");

    new Chart(issueCtx, {
        type: "doughnut",
        data: {
            labels: issueLabels,
            datasets: [{
                data: issueCounts,
                borderWidth: 2,
                hoverOffset: 8
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: "60%",
            plugins: {
                legend: {
                    display: true,
                    position: "bottom",
                    labels: {
                        boxWidth: 12,
                        padding: 12
                    }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const item = issueData[context.dataIndex];
                            const percentage = (item.percentage * 100).toFixed(1);
                            return ` ${item.count} entries`;
                        }
                    }
                }
            }
        }
    });
</script>
