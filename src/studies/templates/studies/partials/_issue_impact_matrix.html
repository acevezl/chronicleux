<div class="p-4 justify-center rounded-sm border border-dashed border-gray-300 dark:border-gray-600 text-sm text-gray-500 dark:text-gray-400">
    <div>
        {% if run.issue_summaries.all %}
            <div>
                <div class="relative h-72 w-full">
                    <canvas id="issueImpactMatrixChart-{{ study.id }}-{{ run.id }}"></canvas>
                </div>
            </div>

            <div class="mt-4 mx-4 text-xs text-gray-500 dark:text-gray-400">
                Issues farther to the right are more frequent, while issues lower on the chart are associated with stronger negative sentiment and may require faster attention.
            </div>
        {% else %}
            <div class="p-4 text-sm text-gray-500 dark:text-gray-400">
                No issue matrix data available.
            </div>
        {% endif %}
    </div>
</div>

{% if run.issue_summaries.all %}
<script>
    function prettifyImpactIssueLabel(label) {
        return label
            .replaceAll("_", " ")
            .split(" ")
            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
            .join(" ");
    }

    const issueImpactData{{ run.id }} = [
        {% for issue_summary in run.issue_summaries.all %}
            {
                label: "{{ issue_summary.issue.name|escapejs }}",
                count: {{ issue_summary.entry_count|default:0 }},
                impact: {{ issue_summary.average_sentiment_score|default:0 }}
            },
        {% endfor %}
    ];

    const issueImpactTotal{{ run.id }} = issueImpactData{{ run.id }}.reduce(
        (sum, item) => sum + item.count,
        0
    );

    const issueImpactPoints{{ run.id }} = issueImpactData{{ run.id }}.map(item => {
        const frequency = issueImpactTotal{{ run.id }}
            ? (item.count / issueImpactTotal{{ run.id }}) * 100
            : 0;

        const negativeSentimentIntensity = -item.impact;

        return {
            x: frequency,
            y: negativeSentimentIntensity,
            r: Math.max(6, Math.min(22, item.count * 2)),
            label: prettifyImpactIssueLabel(item.label),
            count: item.count,
            frequency: frequency,
            negativeSentimentIntensity: negativeSentimentIntensity
        };
    });

    const issueImpactCtx{{ run.id }} = document.getElementById(
        "issueImpactMatrixChart-{{ study.id }}-{{ run.id }}"
    );

    if (issueImpactCtx{{ run.id }}) {
        new Chart(issueImpactCtx{{ run.id }}, {
            type: "bubble",
            data: {
                datasets: [{
                    label: "Issues",
                    data: issueImpactPoints{{ run.id }},
                    backgroundColor: function(context) {
                        const item = context.raw;
                        const maxCount = Math.max(...issueImpactPoints{{ run.id }}.map(point => point.count));
                        const ratio = maxCount ? item.count / maxCount : 0;

                        const red = Math.round(245 + (220 - 245) * ratio);
                        const green = Math.round(158 + (38 - 158) * ratio);
                        const blue = Math.round(11 + (38 - 11) * ratio);

                        return `rgba(${red}, ${green}, ${blue}, 0.45)`;
                    },
                    borderColor: function(context) {
                        const item = context.raw;
                        const maxCount = Math.max(...issueImpactPoints{{ run.id }}.map(point => point.count));
                        const ratio = maxCount ? item.count / maxCount : 0;

                        const red = Math.round(180 + (153 - 180) * ratio);
                        const green = Math.round(83 + (27 - 83) * ratio);
                        const blue = Math.round(9 + (27 - 9) * ratio);

                        return `rgba(${red}, ${green}, ${blue}, 0.95)`;
                    },
                    borderWidth: 2,
                    clip: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: {
                    padding: {
                        top: 12,
                        right: 4,
                        bottom: 28,
                        left: 4
                    }
                },
                scales: {
                    x: {
                        min: 0,
                        max: 100,
                        reverse: false,
                        position: "top",
                        title: {
                            display: true,
                            text: "Frequency"
                        },
                        ticks: {
                            callback: function(value) {
                                return value + "%";
                            }
                        },
                        grid: {
                            drawBorder: false
                        }
                    },
                    y: {
                        min: -1,
                        max: 0,
                        title: {
                            display: true,
                            text: "Negative Sentiment Intensity"
                        },
                        ticks: {
                            callback: function(value) {
                                return Number(value).toFixed(1);
                            }
                        },
                        grid: {
                            drawBorder: false
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const item = context.raw;
                                const frequency = item.frequency.toFixed(1);
                                const negativeSentimentIntensity = Number(item.negativeSentimentIntensity).toFixed(2);

                                return [
                                    `${item.label}`,
                                    `Frequency: ${frequency}%`,
                                    `Entries: ${item.count}`,
                                    `Negative sentiment intensity: ${negativeSentimentIntensity}`
                                ];
                            }
                        }
                    }
                }
            }
        });
    }
</script>
{% endif %}
