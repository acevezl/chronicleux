<div class="group main-card">
    <div class="card-summary">
        <div class="card-summary-title">
            {% heroicon_outline "cursor-arrow-rays" %}
            Issue-Impact Matrix
        </div>
    </div>
    <div class="">
        {% if issue_impact_matrix %}
        <div>
            <div class="relative h-64 w-full overflow-hidden">
                <canvas
                    id="issueImpactMatrixChart-{{ study_id }}-{{ run_id }}"
                ></canvas>
            </div>
        </div>

        <div class="mb-4 mx-4 text-xs text-gray-500 dark:text-gray-400">
            Issues farther right appear more often. Issues higher up are associated with more negative sentiment.
        </div>
        {% else %}
        <div class="p-4 text-sm text-gray-500 dark:text-gray-400">
            No issue-impact data available.
        </div>
        {% endif %}
    </div>
</div>


<script>
    function prettifyImpactIssueLabel(label) {
        return label
            .replaceAll("_", " ")
            .split(" ")
            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
            .join(" ");
    }

    const issueImpactData = [
        {% for issue in issue_impact_matrix %}
            {
                label: "{{ issue.label|escapejs }}",
                count: {{ issue.count }},
                frequency: {{ issue.percentage }},
                negativeRatio: {{ issue.negative_ratio|default:0 }},
                avgSentiment: {{ issue.avg_sentiment|default:0 }}
            },
        {% endfor %}
    ];

    const issueImpactPoints = issueImpactData.map(item => ({
        x: item.frequency * 100,
        y: item.negativeRatio,
        r: Math.max(6, Math.min(22, item.count * 2)),
        label: prettifyImpactIssueLabel(item.label),
        count: item.count,
        frequency: item.frequency,
        negativeRatio: item.negativeRatio,
        avgSentiment: item.avgSentiment
    }));

    const issueImpactCtx = document.getElementById("issueImpactMatrixChart-{{ study_id }}-{{ run_id }}");

    new Chart(issueImpactCtx, {
        type: "bubble",
        data: {
            datasets: [{
                label: "Issues",
                data: issueImpactPoints,
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            layout: {
                padding: {
                    top: 12,
                    right: 16,
                    bottom: 4,
                    left: 4
                }
            },
            scales: {
                x: {
                    min: 0,
                    max: 100,
                    title: {
                        display: true,
                        text: "Frequency"
                    },
                    ticks: {
                        callback: function(value) {
                            return value + "%";
                        }
                    },
                    grid: {
                        drawBorder: false
                    }
                },
                y: {
                    min: 0,
                    max: 1,
                    title: {
                        display: true,
                        text: "Negative impact"
                    },
                    ticks: {
                        callback: function(value) {
                            return value.toFixed(1);
                        }
                    },
                    grid: {
                        drawBorder: false
                    }
                }
            },
            plugins: {
                legend: {
                    display: false
                },
                tooltip: {
                    callbacks: {
                        title: function() {
                            return "Issue impact";
                        },
                        label: function(context) {
                            const item = context.raw;
                            const frequency = item.x.toFixed(1);
                            const negativeRatio = item.y.toFixed(2);
                            const avgSentiment = Number(item.avgSentiment).toFixed(2);

                            return [
                                `${item.label}`,
                                `Frequency: ${frequency}%`,
                                `Negative impact: ${negativeRatio}`,
                                `Avg sentiment: ${avgSentiment}`
                            ];
                        }
                    }
                }
            }
        }
    });
</script>
