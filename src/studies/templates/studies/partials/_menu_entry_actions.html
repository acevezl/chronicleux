{% load heroicons %}

<div class="px-4 py-2 bg-gray-100 dark:bg-gray-900">

		<a
			href="{% url 'entries' entry.study_id %}"
			class="button-TERTIARY"
		>
			{% heroicon_outline "document-duplicate" class="h-4 w-4" %}
            {% heroicon_outline "arrow-left" class="h-4 w-4" %}

		<a
			href="{% url 'diary_study_detail' entry.study_id %}"
