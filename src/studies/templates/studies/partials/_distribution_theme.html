{% if distribution %}
    <div class="relative h-72 w-full overflow-hidden rounded-md bg-gray-50 dark:bg-gray-800 p-2">
        <canvas id="{{ chart_id }}"></canvas>
    </div>

    <script>
        (function () {
            function prettifyThemeLabel(label) {
                return label
                    .replaceAll("_", " ")
                    .split(" ")
                    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                    .join(" ");
            }

            const themeData = [
                {% for item in distribution %}
                    {
                        label: "{{ item.canonical_theme.name|escapejs }}",
                        count: {{ item.entry_count|default:0 }}
                    },
                {% endfor %}
            ];

            const themeTotal = themeData.reduce(
                (sum, item) => sum + item.count,
                0
            );

            const themeLabels = themeData.map(item => {
                const label = prettifyThemeLabel(item.label);
                const percentage = themeTotal
                    ? ((item.count / themeTotal) * 100).toFixed(1)
                    : "0.0";

                return `${label} (${percentage}%)`;
            });

            const themeCounts = themeData.map(item => item.count);

            const themeColors = [
                "#e9d5ff99",
                "#ddd6fe99",
                "#bfdbfe99",
                "#bae6fd99",
                "#ccfbf199",
                "#dcfce799",
                "#fef3c799",
                "#fed7aa99",
                "#fbcfe899",
                "#fecaca99"
            ];

            const themeBorderColors = [
                "#7e22ce",
                "#6d28d9",
                "#1d4ed8",
                "#0369a1",
                "#0f766e",
                "#15803d",
                "#b45309",
                "#c2410c",
                "#be185d",
                "#b91c1c"
            ];

            const themeCtx = document.getElementById("{{ chart_id }}");

            if (themeCtx) {
                new Chart(themeCtx, {
                    type: "doughnut",
                    data: {
                        labels: themeLabels,
                        datasets: [{
                            data: themeCounts,
                            backgroundColor: themeData.map(
                                (item, index) => themeColors[index % themeColors.length]
                            ),
                            borderColor: themeData.map(
                                (item, index) => themeBorderColors[index % themeBorderColors.length]
                            ),
                            borderWidth: 1
                        }]
                    },
                    options: {
                        cutout: "70%",
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: "bottom",
                                labels: {
                                    boxWidth: 12,
                                    boxHeight: 12
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const item = themeData[context.dataIndex];
                                        const percentage = themeTotal
                                            ? ((item.count / themeTotal) * 100).toFixed(1)
                                            : "0.0";

                                        return ` ${item.count} entries (${percentage}%)`;
                                    }
                                }
                            }
                        },
                    }
                });
            }
        })();
    </script>
{% else %}
    <div class="flex h-72 items-center justify-center rounded-md border border-dashed border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800">
        <span class="text-sm text-gray-500 dark:text-gray-400">
            No theme distribution available.
        </span>
    </div>
{% endif %}
