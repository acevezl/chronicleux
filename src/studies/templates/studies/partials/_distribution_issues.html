{% load heroicons %}

<div class="group main-card">
    <div class="card-summary">
        <div class="card-summary-title">
            {% heroicon_outline "exclamation-triangle" %}
            Recurring Issues
        </div>
    </div>

    {% if run.canonical_issue_summaries.all %}
        <div class="mt-4">
            <div class="relative h-64 w-full overflow-hidden">
                <canvas id="issueDistributionChart-{{ study.id }}-{{ run.id }}"></canvas>
            </div>
        </div>
    {% else %}
        <div class="p-4 text-sm text-gray-500 dark:text-gray-400">
            No recurring issues detected.
        </div>
    {% endif %}
</div>

{% if run.canonical_issue_summaries.all %}
<script>
    function prettifyIssueLabel(label) {
        return label
            .replaceAll("_", " ")
            .split(" ")
            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
            .join(" ");
    }

    const issueData{{ run.id }} = [
        {% for issue_summary in run.canonical_issue_summaries.all %}
            {
                label: "{{ issue_summary.canonical_issue.name|escapejs }}",
                count: {{ issue_summary.entry_count|default:0 }}
            },
        {% endfor %}
    ];

    const issueTotal{{ run.id }} = issueData{{ run.id }}.reduce(
        (sum, item) => sum + item.count,
        0
    );

    const issueLabels{{ run.id }} = issueData{{ run.id }}.map(item => {
        const label = prettifyIssueLabel(item.label);
        const percentage = issueTotal{{ run.id }}
            ? ((item.count / issueTotal{{ run.id }}) * 100).toFixed(1)
            : "0.0";

        return `${label} (${percentage}%)`;
    });

    const issueCounts{{ run.id }} = issueData{{ run.id }}.map(item => item.count);

    const issueCtx{{ run.id }} = document.getElementById(
        "issueDistributionChart-{{ study.id }}-{{ run.id }}"
    );

    if (issueCtx{{ run.id }}) {
        new Chart(issueCtx{{ run.id }}, {
            type: "doughnut",
            data: {
                labels: issueLabels{{ run.id }},
                datasets: [{
                    data: issueCounts{{ run.id }},
                    borderWidth: 2,
                    hoverOffset: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: "60%",
                plugins: {
                    legend: {
                        display: true,
                        position: "bottom",
                        labels: {
                            boxWidth: 12,
                            padding: 12
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const item = issueData{{ run.id }}[context.dataIndex];
                                return ` ${item.count} entries`;
                            }
                        }
                    }
                }
            }
        });
    }
</script>
{% endif %}
