{% if distribution %}
    <div class="flex h-72 items-center justify-center rounded-md border border-dashed border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 p-4">
        <canvas id="{{ chart_id }}"></canvas>
    </div>

    <script>
        (function () {
            function prettifyIssueLabel(label) {
                return label
                    .replaceAll("_", " ")
                    .split(" ")
                    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                    .join(" ");
            }

            const issueData = [
                {% for item in distribution %}
                    {
                        label: "{{ item.issue.name|escapejs }}",
                        count: {{ item.entry_count|default:0 }}
                    },
                {% endfor %}
            ];

            const issueTotal = issueData.reduce(
                (sum, item) => sum + item.count,
                0
            );

            const issueLabels = issueData.map(item => {
                const label = prettifyIssueLabel(item.label);
                const percentage = issueTotal
                    ? ((item.count / issueTotal) * 100).toFixed(1)
                    : "0.0";

                return `${label} (${percentage}%)`;
            });

            const issueCounts = issueData.map(item => item.count);

            const issueColors = [
                "#fed7aa99",
                "#fecaca99",
                "#fde68a99",
                "#fbcfe899",
                "#ffedd599",
                "#fee2e299",
                "#fef3c799",
                "#fae8ff99",
                "#fce7f399",
                "#fef2f299"
            ];

            const issueBorderColors = [
                "#c2410c",
                "#b91c1c",
                "#b45309",
                "#be185d",
                "#ea580c",
                "#dc2626",
                "#ca8a04",
                "#a21caf",
                "#db2777",
                "#991b1b"
            ];

            const issueCtx = document.getElementById("{{ chart_id }}");

            if (issueCtx) {
                new Chart(issueCtx, {
                    type: "doughnut",
                    data: {
                        labels: issueLabels,
                        datasets: [{
                            data: issueCounts,
                            backgroundColor: issueData.map(
                                (item, index) => issueColors[index % issueColors.length]
                            ),
                            borderColor: issueData.map(
                                (item, index) => issueBorderColors[index % issueBorderColors.length]
                            ),
                            borderWidth: 1
                        }]
                    },
                    options: {
                        cutout: "70%",
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: "bottom",
                                labels: {
                                    boxWidth: 12,
                                    boxHeight: 12
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const item = issueData[context.dataIndex];
                                        const percentage = issueTotal
                                            ? ((item.count / issueTotal) * 100).toFixed(1)
                                            : "0.0";

                                        return ` ${item.count} entries (${percentage}%)`;
                                    }
                                }
                            }
                        },
                    }
                });
            }
        })();
    </script>
{% else %}
    <div class="flex h-72 items-center justify-center rounded-md border border-dashed border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800">
        <span class="text-sm text-gray-500 dark:text-gray-400">
            No issue distribution available.
        </span>
    </div>
{% endif %}
