{% if distribution %}
    <div class="relative h-72 w-full overflow-hidden rounded-md border border-dashed border-gray-300 dark:border-gray-600 p-4">
        <canvas id="{{ chart_id }}"></canvas>
    </div>

    <script>
        (function () {
            function prettifySentimentLabel(label) {
                return label
                    .toLowerCase()
                    .split("_")
                    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                    .join(" ");
            }

            const sentimentData = [
                {% for item in distribution %}
                    {
                        label: "{{ item.label|escapejs }}",
                        count: {{ item.count|default:0 }},
                        percentage: {{ item.percentage|default:0 }}
                    },
                {% endfor %}
            ];

            const sentimentOrder = {
                VERY_NEGATIVE: 1,
                NEGATIVE: 2,
                NEUTRAL: 3,
                POSITIVE: 4,
                VERY_POSITIVE: 5
            };

            sentimentData.sort((a, b) => {
                return sentimentOrder[a.label] - sentimentOrder[b.label];
            });

            const sentimentColors = {
                VERY_NEGATIVE: "#fecaca99",
                NEGATIVE: "#fee2e299",
                NEUTRAL: "#fde68a99",
                POSITIVE: "#dcfce799",
                VERY_POSITIVE: "#bbf7d099"
            };

            const sentimentBorderColors = {
                VERY_NEGATIVE: "#991b1b",
                NEGATIVE: "#b91c1c",
                NEUTRAL: "#b45309",
                POSITIVE: "#15803d",
                VERY_POSITIVE: "#166534"
            };

            const sentimentLabels = sentimentData.map(item => {
                const label = prettifySentimentLabel(item.label);
                const percentage = (item.percentage * 100).toFixed(1);

                return `${label} (${percentage}%)`;
            });

            const sentimentCounts = sentimentData.map(item => item.count);

            const sentimentCtx = document.getElementById("{{ chart_id }}");

            if (sentimentCtx) {
                new Chart(sentimentCtx, {
                    type: "polarArea",
                    data: {
                        labels: sentimentLabels,
                        datasets: [{
                            data: sentimentCounts,
                            backgroundColor: sentimentData.map(
                                item => sentimentColors[item.label] || "#e5e7eb99"
                            ),
                            borderColor: sentimentData.map(
                                item => sentimentBorderColors[item.label] || "#374151"
                            ),
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: "bottom",
                                labels: {
                                    boxWidth: 12,
                                    boxHeight: 12
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const item = sentimentData[context.dataIndex];
                                        const percentage = (item.percentage * 100).toFixed(1);
                                        return ` ${item.count} entries (${percentage}%)`;
                                    }
                                }
                            }
                        },
                        scales: {
                            r: {
                                ticks: {
                                    display: true
                                },
                                grid: {
                                    color: "#e5e7eb"
                                },
                                angleLines: {
                                    color: "#e5e7eb"
                                }
                            }
                        }
                    }
                });
            }
        })();
    </script>
{% else %}
    <div class="flex h-72 items-center justify-center rounded-md border border-dashed border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800">
        <span class="text-sm text-gray-500 dark:text-gray-400">
            No sentiment distribution available.
        </span>
    </div>
{% endif %}
