{% extends "base.html" %}
{% load static %}

{% block title %}{{ study.title }}Import Diary Entries · ChronicleUX{% endblock %}

{% block content %}

<div class="mt-2 md:flex md:items-center md:justify-between">
  <div class="min-w-0 flex-1">
    <h1 class="text-gray-900 sm:truncate sm:text-3xl sm:tracking-tight dark:text-white">
      Import Entries
    </h1>
  </div>
</div>

<div class="mt-6 flex gap-4">
    <div class="border border-gray-200 dark:border-gray-600 rounded-sm overflow-hidden ">
        <div class="px-6 py-4 bg-gray-100 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-600">
            <span class="text-xl text-fuchsia-700 dark:text-gray-200">{{study.title}}</span>
            <div class="flex md:grid-cols-2 gap-6">
                <span class="mt-1 text-sm text-gray-900 dark:text-gray-400">Select a file to import diary entries into this study.</span>
            </div>
        </div>
        <div class="p-6">
            <form method="post" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}
                Select a file:
                <input type="file" 
                    class="text-gray-600 mt-1 px-2 block w-full rounded-sm border border-gray-300 focus:ring-gray-700 dark:text-gray-200"
                    name="file">
                <button 
                    class="inline-flex items-center rounded-md bg-fuchsia-800 px-4 py-2 text-sm font-medium text-white hover:bg-fuchsia-700 cursor-pointer"
                    type="submit">
                    Import
                </button>
            </form>
        </div>

    </div>
</div>
{% endblock %}
